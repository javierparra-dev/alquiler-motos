name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar el motor C++ a WebAssembly
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd ..
          mkdir -p wasm/out
          emcc wasm/src/motor.cpp -o wasm/out/motor.js \
            -s EXPORTED_FUNCTIONS="['_tarifaDinamica','_factorDemanda','_factorClima','_scoreDesgaste','_estadoMantenimiento']" \
            -s EXPORTED_RUNTIME_METHODS="['cwrap','ccall']" \
            -s ALLOW_MEMORY_GROWTH=1 -O2

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (todo el repo, incluye wasm/out)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Desplegar
        uses: actions/deploy-pages@v4