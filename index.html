<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoFlow Optimizer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">MotoFlow <b>Optimizer</b></span>
    <span class="tagline">Alquiler de motos con motor de calculo en C++</span>
  </header>

  <div id="map"></div>

  <aside class="panel">
    <h2>Simular viaje</h2>

    <div class="field">
      <label for="pickup">Punto A (origen)</label>
      <input type="text" id="pickup" placeholder="Hace click en el mapa..." readonly />
    </div>

    <div class="field">
      <label for="dropoff">Punto B (destino)</label>
      <input type="text" id="dropoff" placeholder="Hace click en el mapa..." readonly />
    </div>

    <div class="field">
      <label for="moto">Moto</label>
      <select id="moto"></select>
    </div>

    <button id="simulate" class="btn-primary">Simular viaje</button>
    <button id="reset" class="btn-ghost">Limpiar</button>

    <div id="result" class="result hidden">
      <h3>Tarifa dinamica</h3>
      <table>
        <tr><td>Distancia</td><td id="r-dist">-</td></tr>
        <tr><td>Duracion</td><td id="r-time">-</td></tr>
        <tr><td>Factor demanda</td><td id="r-demand">-</td></tr>
        <tr><td>Factor clima</td><td id="r-weather">-</td></tr>
        <tr class="total"><td>Total</td><td id="r-total">-</td></tr>
      </table>
      <p class="note">Calculo simulado. El proximo paso es correrlo en el motor C++ (WASM).</p>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
